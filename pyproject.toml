[build-system]
requires = ['hatchling==1.27.0']
build-backend = 'hatchling.build'

[project]
name = 'indico-plugin-stsa'
description = 'STSA customizations for Indico: e-mail subject prefixes, a member discount, the standard wallet buttons, and an STSA ticket'
readme = 'README.md'
license = 'MIT'
authors = [{ name = 'Singapore Taiwanese Student Association' }]
classifiers = [
    'Environment :: Plugins',
    'Environment :: Web Environment',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.12',
]
requires-python = '>=3.12.2, <3.13'
dynamic = ['version']
dependencies = [
    # Upper bound on purpose. pip is allowed to *upgrade* Indico to satisfy
    # this, and an Indico whose code is ahead of its database breaks every page
    # that touches a migrated table -- so the range is capped at the series
    # this plugin is tested against. Install with `--no-deps` into an existing
    # Indico venv if you would rather pip did not touch Indico at all.
    'indico>=3.3,<3.4',
]

[project.optional-dependencies]
dev = ['pytest>=8', 'pytest-cov>=5', 'ruff>=0.8']

[project.urls]
Homepage = 'https://github.com/stsa-tw/IndicoSTSA'
Source = 'https://github.com/stsa-tw/IndicoSTSA'
Issues = 'https://github.com/stsa-tw/IndicoSTSA/issues'

[project.entry-points.'indico.plugins']
stsa = 'indico_stsa.plugin:STSAPlugin'

[tool.hatch.version]
path = 'indico_stsa/__init__.py'

[tool.hatch.build]
include = ['indico_stsa']
# The webpack bundle under `static/dist/` is a build artifact, so git ignores it
# -- and hatchling follows .gitignore, which would leave it out of the sdist and
# the wheel.  `artifacts` is the override.  Without it, every install is missing
# `static/dist/manifest.json` and Indico raises `Assets for plugin stsa have not
# been built` on every registration page.
artifacts = ['indico_stsa/static/dist/']
# ...but not Apple's badge artwork, which an operator installs into
# `static/wallet/apple/` under their own licence.  `artifacts` overrides
# .gitignore, so without this an installed copy on a maintainer's machine would
# be swept into the package and published.
exclude = ['indico_stsa/static/wallet/apple/*.svg', 'indico_stsa/static/wallet/apple/*.png']

[tool.hatch.build.targets.sdist]
# The sdist has to stay buildable on its own, so it keeps the JS sources and the
# bundle definition webpack reads.
include = ['indico_stsa', 'tests', 'scripts', 'webpack-bundles.json', 'build-assets.py', 'ruff.toml']

[tool.hatch.build.targets.wheel]
packages = ['indico_stsa']
# The compiled bundle is what runs; the sources it was built from live in git
# and in the sdist, and webpack already inlines them into the source maps.
# Apple's artwork is excluded for licensing reasons -- see `[tool.hatch.build]`.
exclude = ['indico_stsa/client/',
           'indico_stsa/static/wallet/apple/*.svg',
           'indico_stsa/static/wallet/apple/*.png']

[tool.pytest.ini_options]
testpaths = ['tests']
# Indico ships a pytest plugin that pulls in its whole database fixture stack
# (and needs docker).  The unit tests here do not use it.
addopts = '-p no:indico'
